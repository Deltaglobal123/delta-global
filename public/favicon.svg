<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="dg-tile" x1="4" y1="2" x2="58" y2="62" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3CE68F"/>
      <stop offset="0.42" stop-color="#57E1C6"/>
      <stop offset="0.72" stop-color="#7FD5E4"/>
      <stop offset="1" stop-color="#AEBCF3"/>
    </linearGradient>
    <linearGradient id="dg-gloss" x1="10" y1="0" x2="34" y2="40" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="dg-face" x1="27" y1="14" x2="48" y2="50" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DFF9F0"/>
    </linearGradient>
  </defs>

  <rect width="64" height="64" rx="16.5" fill="url(#dg-tile)"/>
  <rect width="64" height="64" rx="16.5" fill="url(#dg-gloss)"/>

  <!-- Back play: cut through the tile to the dark beneath. -->
  <path d="M17.5 15.5 36 32 17.5 48.5Z" fill="#0E2F2C"
        stroke="#0E2F2C" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- The front play's cast shadow, offset right and down. -->
  <path d="M29.5 15 51.5 32.6 29.5 50.2Z" fill="#0B2A45" opacity="0.85"
        stroke="#0B2A45" stroke-width="2.4" stroke-linejoin="round"/>

  <!-- Front play. -->
  <path d="M27 15 49 32 27 49Z" fill="url(#dg-face)"
        stroke="url(#dg-face)" stroke-width="2.4" stroke-linejoin="round"/>
</svg>
